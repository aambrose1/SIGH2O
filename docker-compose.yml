services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  app:
    build: ./app
    ports:
      - "8080"
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=soilmonitor;Username=soil;Password=${DB_PASSWORD}
      - Pushover__ApiToken=${PUSHOVER_TOKEN}
      - Pushover__UserKey=${PUSHOVER_USER}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=soilmonitor
      - POSTGRES_USER=soil
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
