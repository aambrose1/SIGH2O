error_log /var/log/nginx/error.log debug;

events {}

http {
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''	close;
	}
	server {
		listen 80;
		server_name soilmoisture404.qzz.io;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name soilmoisture404.qzz.io;

		ssl_certificate     /etc/letsencrypt/live/soilmoisture404.qzz.io/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/soilmoisture404.qzz.io/privkey.pem;

		location ~* /\.(env|git|aws|htpasswd|DS_Store) {
			return 404;
		}

		location ~* /(wp-config|phpinfo|backup|dump)\.php {
			return 404;
		}

		# WebSocket endpoint
		location /ws {
			allow 207.68.224.28;
			allow 172.17.152.195;
			allow 165.227.102.119;

			deny all;

			proxy_pass http://app:8080;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto https;
			proxy_set_header X-Forwarded_For $proxy_add_x_forwarded_for;
			proxy_hide_header X-Original-Proto;
			proxy_read_timeout 3600s;
			proxy_buffering off;
		}

		# Everything else → Blazor app
		location / {
			proxy_pass http://app:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
