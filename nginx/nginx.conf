error_log /var/log/nginx/error.log debug;

events {}

http {
	limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
	limit_req_zone $binary_remote_addr zone=perip_req:10m rate=10r/s;

	server {
		listen 80;
		server_name soilmoisture404.qzz.io;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name soilmoisture404.qzz.io;

		ssl_certificate     /etc/letsencrypt/live/soilmoisture404.qzz.io/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/soilmoisture404.qzz.io/privkey.pem;

		limit_conn perip_conn 3;
		limit_req zone=perip_req burst=10 nodelay;
		limit_req_status 429;
		limit_conn_status 429;

		location ~* /\.(env|git|aws|htpasswd|DS_Store) {
			return 404;
		}

		location ~* /(wp-config|phpinfo|backup|dump)\.php {
			return 404;
		}

		# WebSocket endpoint
		location /ws {
			allow 207.68.224.28;
			allow 172.17.152.193;
			allow 165.227.102.119;

			deny all;

			proxy_pass http://app:8080;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto https;
			proxy_read_timeout 3600s;
			proxy_buffering off;
		}

		# Everything else → Blazor app
		location / {
			proxy_pass http://app:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
